[project]
name = "rhiza"
version = "0.8.0"
description = "Reusable configuration templates for modern Python projects"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Thomas Schmelzer" }
]
keywords = ["templates", "configuration", "ci", "ruff"]
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
]
dependencies = []

[dependency-groups]
dev = [
    "pyyaml>=6.0,<7.0",      # YAML parsing for validation scripts (v6+ for security fixes, <7.0 for API stability)

    # Testing (was .rhiza/requirements/tests.txt)
    "pytest>=8.0",           # Test runner — `uv run pytest` in test.mk
    "pytest-cov>=6.0",       # --cov flags in test.mk (used when SOURCE_FOLDER exists)
    "pytest-html>=4.0",      # --html report, both branches of test.mk
    "hypothesis>=6.150.0",   # Property-based tests in tests/property/
    "defusedxml>=0.7.0",     # Safe XML parsing in test_sbom.py
    "python-dotenv==1.2.2",  # Imported as `dotenv` in tests; pinned per the stricter former spec

    # Development tools (was .rhiza/requirements/tools.txt)
    "ty==0.0.65",            # Type checker — `uv run ty check` in test.mk

    # Documentation (was .rhiza/requirements/docs.txt)
    "interrogate>=1.7.0",    # Docstring coverage — `uv run interrogate` in test.mk
]
# Deliberately NOT declared here — these are obtained at runtime by the recipes
# that use them, so declaring them would duplicate the version source of truth:
#   pre-commit        uvx in quality.mk / bootstrap.mk
#   pdoc              `uv pip install pdoc` in docs.mk
# And these have no consumer at all: pytest-mock, typer, pytest-benchmark,
# pygal (the last two lost theirs when the benchmark target was removed), and
# marimo/numpy/plotly/pandas (which lost theirs when the marimo and book
# subsystems were removed).

[project.urls]
Homepage = "https://github.com/jebel-quant/rhiza"
Repository = "https://github.com/jebel-quant/rhiza"
Issues = "https://github.com/jebel-quant/rhiza/issues"

[tool.deptry.package_module_name_map]
pyyaml = "yaml"
pytest = "pytest"
pytest-cov = "pytest_cov"
pytest-html = "pytest_html"
hypothesis = "hypothesis"
defusedxml = "defusedxml"
python-dotenv = "dotenv"
ty = "ty"
interrogate = "interrogate"
